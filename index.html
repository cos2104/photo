async function shareKakao() {
  if (!KAKAO_JS_KEY || !window.Kakao || !Kakao.isInitialized()) {
    alert('카카오 공유를 쓰려면 index.html 상단의 KAKAO_JS_KEY에\ndevelopers.kakao.com에서 발급받은 JavaScript 키를 입력해주세요.');

  }
  try {
    const canvas = document.getElementById('stickerCanvas');
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], 'photobooth.png', { type: 'image/png' });
    const res = await Kakao.Share.uploadImage({ file: [file] });
    const imgUrl = res.infos.original.url;
    Kakao.Share.sendDefault({

    alert('공유에 실패했어요: ' + (e && e.message ? e.message : e));

}

/* ---------- 과학자 이미지 (images/키이름.png 가 있으면 자동 사용, 없으면 이모지) ---------- */
/* 이미지의 단색 배경(흰색 등)은 자동으로 투명하게 지워집니다.
   가장자리에서 연결된 배경만 지우므로, 인물 안쪽의 흰색(머리카락, 가운 등)은 유지됩니다. */
const sciImages = {};
Object.keys(SCIENTISTS).forEach(k => {
  const im = new Image();
  im.onload = () => { sciImages[k] = removeImageBackground(im); };
  im.src = 'images/' + k + '.png';
});

function removeImageBackground(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const W = c.width, H = c.height;
  const data = ctx.getImageData(0, 0, W, H);
  const px = data.data;

  // 이미 투명 배경인 이미지는 그대로 사용
  for (let x = 0; x < W; x += 10) {
    if (px[x * 4 + 3] < 250 || px[((H - 1) * W + x) * 4 + 3] < 250) return c;
  }

  // 배경색 추정: 네 모서리 픽셀의 평균
  const corners = [0, (W - 1) * 4, (H - 1) * W * 4, ((H - 1) * W + W - 1) * 4];
  let br = 0, bg = 0, bb = 0;
  corners.forEach(i => { br += px[i]; bg += px[i + 1]; bb += px[i + 2]; });
  br /= 4; bg /= 4; bb /= 4;

  const TOL = 48; // 배경으로 판정할 색 차이 허용치
  const dist = i => Math.sqrt((px[i] - br) ** 2 + (px[i + 1] - bg) ** 2 + (px[i + 2] - bb) ** 2);

  // 가장자리에서 시작해 배경색과 비슷한 픽셀만 따라가며 투명 처리 (flood fill)
  const visited = new Uint8Array(W * H);
  const stack = [];
  for (let x = 0; x < W; x++) { stack.push(x, (H - 1) * W + x); }
  for (let y = 0; y < H; y++) { stack.push(y * W, y * W + W - 1); }
  while (stack.length) {
    const p = stack.pop();
    if (visited[p]) continue;
    visited[p] = 1;
    const i = p * 4;
    const d = dist(i);
    if (d < TOL) {
      px[i + 3] = 0;
      const x = p % W, y = (p / W) | 0;
      if (x > 0) stack.push(p - 1);
      if (x < W - 1) stack.push(p + 1);
      if (y > 0) stack.push(p - W);
      if (y < H - 1) stack.push(p + W);
    } else if (d < TOL * 2) {
      // 경계선은 반투명으로 부드럽게
      px[i + 3] = Math.min(px[i + 3], Math.round(255 * (d - TOL) / TOL));
    }
  }
  ctx.putImageData(data, 0, 0);
  return c;
}

let qIndex = 0;
let scores = {};

function startQuiz() {
  qIndex = 0;
  scores = {};
  Object.keys(SCIENTISTS).forEach(k => scores[k] = 0);
  showScreen('scr-quiz');
  renderQuestion();
}

function renderQuestion() {
  const item = QUESTIONS[qIndex];
  document.getElementById('quizProgress').style.width = (qIndex / QUESTIONS.length * 100) + '%';
  document.getElementById('qText').textContent = `Q${qIndex + 1}. ${item.q}`;
  const box = document.getElementById('qAnswers');
  box.innerHTML = '';
  item.a.forEach(([text, pts]) => {
    const b = document.createElement('button');
    b.textContent = text;
    b.onclick = () => {
      for (const k in pts) scores[k] += pts[k];
      qIndex++;
      if (qIndex < QUESTIONS.length) renderQuestion();
      else finishQuiz();
    };
    box.appendChild(b);
  });
}

let matched = null;
let matchedKey = null;

function finishQuiz() {
  showScreen('scr-analyzing');
  setTimeout(() => {
    const best = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
    matched = SCIENTISTS[best];
    matchedKey = best;
    const avatarEl = document.getElementById('rAvatar');
    if (sciImages[best]) {
      avatarEl.innerHTML = '';
      const img = document.createElement('img');
      img.src = sciImages[best].toDataURL();
      img.alt = matched.name;
      avatarEl.appendChild(img);
    } else {
      avatarEl.textContent = matched.avatar;
    }
    document.getElementById('rName').textContent = matched.name;
    document.getElementById('rField').textContent = matched.field;
    document.getElementById('rDesc').textContent = matched.desc;
    const kw = document.getElementById('rKeywords');
    kw.innerHTML = '';
    matched.keywords.forEach(k => {
      const s = document.createElement('span');
      s.textContent = '#' + k;
      kw.appendChild(s);
    });
    showScreen('scr-result');
  }, 2200);
}

/* ---------- 프레임 선택 ---------- */
let frameType = 'science';
function pickFrame(type) {
  frameType = type;
  shots = [];
  showScreen('scr-camera');
}

/* ---------- 카메라 ---------- */
const video = document.getElementById('video');
let stream = null;
let shots = [];

async function initCamera() {
  document.getElementById('camError').classList.remove('show');
  updateShotUI();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
  } catch (e) {
    document.getElementById('camError').classList.add('show');
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function updateShotUI() {
  document.getElementById('shotNum').textContent = shots.length;
  const t = document.getElementById('thumbs');
  t.innerHTML = '';
  shots.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    t.appendChild(img);
  });
}

async function startShooting() {
  if (!stream) { initCamera(); return; }
  const btn = document.getElementById('shootBtn');
  btn.disabled = true;
  while (shots.length < 4) {
    await countdown(3);
    capture();
    updateShotUI();
    await sleep(600);
  }
  btn.disabled = false;
  stopCamera();
  composeSticker();
  showScreen('scr-final');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function countdown(n) {
  const el = document.getElementById('countdown');
  el.classList.add('show');
  for (let i = n; i >= 1; i--) {
    el.textContent = i;
    await sleep(1000);
  }
  el.classList.remove('show');
}

function capture() {
  const c = document.createElement('canvas');
  c.width = video.videoWidth || 1280;
  c.height = video.videoHeight || 960;
  const ctx = c.getContext('2d');
  ctx.translate(c.width, 0);
  ctx.scale(-1, 1); // 거울모드
  ctx.drawImage(video, 0, 0, c.width, c.height);
  shots.push(c.toDataURL('image/jpeg', 0.92));
  const flash = document.getElementById('flash');
  flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
}

/* ---------- 스티커 합성 ---------- */
function composeSticker() {
  const canvas = document.getElementById('stickerCanvas');
  const W = 600, PAD = 34, GAP = 18;
  const photoW = W - PAD * 2;
  const photoH = Math.round(photoW * 3 / 4);
  const headerH = 104, footerH = 118;
  const H = headerH + photoH * 4 + GAP * 3 + footerH;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  const isSci = frameType === 'scientist';

  /* ----- 배경 ----- */
  if (isSci) {
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#232963'); grad.addColorStop(1, '#5a3fa0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) {
      const x = (i * 137.5) % W, y = (i * 91.7) % H;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + (i % 4) * 0.15) + ')';
      ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3) * 0.7, 0, Math.PI * 2); ctx.fill();
    }
  } else {
    // 파스텔 민트 스트라이프 배경
    ctx.fillStyle = '#cdeeda';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#c1e7d0';
    for (let x = 0; x < W; x += 44) ctx.fillRect(x, 0, 22, H);
  }

  /* ----- 헤더 ----- */
  ctx.textAlign = 'center';
  if (isSci) {
    ctx.fillStyle = '#ffd54a';
    ctx.font = '900 32px "Malgun Gothic", sans-serif';
    ctx.fillText('과학의 날 포토부스', W / 2, 52);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '700 15px "Malgun Gothic", sans-serif';
    ctx.fillText('— SCIENCE DAY PHOTO BOOTH —', W / 2, 80);
  } else {
    ctx.fillStyle = '#2e7d5b';
    ctx.font = '900 36px "Malgun Gothic", sans-serif';
    ctx.fillText('SCIENCE DAY', W / 2, 56);
    ctx.fillStyle = '#5aa583';
    ctx.font = '800 17px "Malgun Gothic", sans-serif';
    ctx.fillText('💚 0 4 2 1 💚 과학의 날 포토부스', W / 2, 86);
  }

  // 사진 4컷
  const imgs = shots.map(src => { const im = new Image(); im.src = src; return im; });
  let loaded = 0;
  imgs.forEach(im => im.onload = () => { if (++loaded === imgs.length) draw(); });
  if (imgs.every(im => im.complete)) draw();

  function draw() {
    const sciIm = matchedKey ? sciImages[matchedKey] : null;

    imgs.forEach((im, i) => {
      const y = headerH + i * (photoH + GAP);

      ctx.save();
      roundRect(ctx, PAD, y, photoW, photoH, 14);
      ctx.clip();
      // cover 방식으로 크롭
      const sr = im.width / im.height, dr = photoW / photoH;
      let sx = 0, sy = 0, sw = im.width, sh = im.height;
      if (sr > dr) { sw = im.height * dr; sx = (im.width - sw) / 2; }
      else { sh = im.width / dr; sy = (im.height - sh) / 2; }
      ctx.drawImage(im, sx, sy, sw, sh, PAD, y, photoW, photoH);

      // "과학자와 함께" 프레임: 컷마다 캐릭터가 좌우를 번갈아가며 함께 등장
      if (isSci && matched) {
        const size = Math.round(photoW * 0.38);
        const onRight = i % 2 === 0;
        const cx = onRight ? PAD + photoW - size * 0.52 : PAD + size * 0.52;
        const cy = y + photoH - size * 0.44;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate((onRight ? 5 : -5) * Math.PI / 180);
        if (sciIm) {
          ctx.shadowColor = 'rgba(0,0,0,0.35)';
          ctx.shadowBlur = 10;
          ctx.drawImage(sciIm, -size / 2, -size / 2, size, size);
        } else {
          ctx.font = Math.round(size * 0.55) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(matched.avatar, 0, size * 0.18);
        }
        ctx.restore();
      }
      ctx.restore();

      // 사진 테두리
      ctx.strokeStyle = isSci ? 'rgba(255,255,255,0.65)' : '#ffffff';
      ctx.lineWidth = isSci ? 3 : 5;
      roundRect(ctx, PAD, y, photoW, photoH, 14);
      ctx.stroke();
    });

    // "과학의 날" 프레임: 가장자리에 과학 아이콘 스티커 장식
    if (!isSci) {
      const deco = ['🧪', '🚀', '🔬', '🧬', '⚗️', '🎈', '⭐', '💚', '🪐', '✨'];
      const zoneH = photoH * 4 + GAP * 3 + 40;
      deco.forEach((e, idx) => {
        const left = idx % 2 === 0;
        const x = left ? PAD - 5 : W - PAD + 5;
        const yy = headerH + 5 + idx * (zoneH / deco.length);
        ctx.save();
        ctx.translate(x, yy);
        ctx.rotate((left ? -15 : 15) * Math.PI / 180);
        ctx.font = '30px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(e, 0, 10);
        ctx.restore();
      });
    }

    /* ----- 푸터 ----- */
    const fy = headerH + photoH * 4 + GAP * 3;
    ctx.textAlign = 'center';
    const d = new Date();
    const dateStr = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    if (isSci) {
      ctx.fillStyle = '#ffd54a';
      ctx.font = '900 27px "Malgun Gothic", sans-serif';
      ctx.fillText(matched ? matched.name : '과학의 날 기념', W / 2, fy + 48);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.font = '14px "Malgun Gothic", sans-serif';
      ctx.fillText(matched ? '나와 결이 맞는 과학자와 함께 · ' + dateStr : dateStr, W / 2, fy + 76);
    } else {
      ctx.fillStyle = '#2e7d5b';
      ctx.font = '900 30px "Malgun Gothic", sans-serif';
      ctx.fillText('HAPPY SCIENCE DAY 💚', W / 2, fy + 50);
      ctx.fillStyle = '#6fae8f';
      ctx.font = '14px "Malgun Gothic", sans-serif';
      ctx.fillText(dateStr, W / 2, fy + 78);
    }

    document.getElementById('stickerImg').src = canvas.toDataURL('image/png');
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function saveSticker() {
  const a = document.createElement('a');
  a.href = document.getElementById('stickerCanvas').toDataURL('image/png');
  a.download = 'photobooth_' + Date.now() + '.png';
  a.click();
}

function retake() {
  shots = [];
  showScreen('scr-camera');
}
