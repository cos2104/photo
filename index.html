<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학자 포토부스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Scientist Photo Booth</h1>
            <p>나와 꼭 맞는 과학자를 찾고 함께 네컷 사진을 찍어보세요!</p>
        </header>

        <section id="survey-section">
            <div id="question-container">
                <h2 id="question-text">질문이 여기에 표시됩니다.</h2>
                <div id="answer-buttons">
                    </div>
            </div>
        </section>

        <main id="main-booth" style="display: none;">
            
            <section class="camera-section">
                <div class="video-wrapper">
                    <video id="webcam" autoplay playsinline></video>
                    
                    <img id="scientist-overlay" src="" alt="과학자 캐릭터">
                    
                    <div id="flash"></div>
                </div>
                
                <div class="controls">
                    <div id="match-info">당신은 <span id="scientist-name">???</span>형 과학자!</div>
                    <div class="button-group">
                        <button id="capture-btn">사진 찍기</button>
                        <button id="reset-btn">다시 찍기</button>
                    </div>
                </div>
            </section>

            <section class="preview-section">
                <div id="photo-strip" class="strip-white">
                    <div class="photo-slot" id="slot-1"></div>
                    <div class="photo-slot" id="slot-2"></div>
                    <div class="photo-slot" id="slot-3"></div>
                    <div class="photo-slot" id="slot-4"></div>
                    <div class="strip-footer">
                        <span id="current-date">2026. 04. 25</span>
                    </div>
                </div>

                <div class="download-area">
                    <button id="download-btn" disabled>이미지 저장하기</button>
                </div>
            </section>
        </main>

        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
